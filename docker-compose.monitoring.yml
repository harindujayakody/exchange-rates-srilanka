# Monitoring and management for the containers on this Docker host:
#   Dozzle    live logs          http://localhost:8080
#   Portainer manage containers  https://localhost:9443  (create the admin user within 5 minutes of first start)
#
# A separate install from the app: start it once, it keeps running, and it sees and manages every
# container on this host (the app included) through the Docker socket.
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Both can read (Portainer can also control) every container, so they only listen on this machine (127.0.0.1).
# To reach them from elsewhere, put them behind a password and HTTPS first.
name: monitoring
services:
  dozzle:
    image: amir20/dozzle:v8
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: "true"

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

volumes:
  portainer-data:
